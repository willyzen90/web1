<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHRONO//NEXUS - Reloj Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #030712;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-yellow: #f59e0b;
      --glow-cyan: 0 0 25px rgba(6, 182, 212, 0.5);
      --glow-pink: 0 0 25px rgba(236, 72, 153, 0.5);
      --font-digital: 'Orbitron', monospace;
      --font-body: 'Rajdhani', sans-serif;
    }

    [data-theme="dark"] {
      --bg-color: #0b0f19;
      --card-bg: rgba(26, 32, 48, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --accent-cyan: #38bdf8;
      --accent-pink: #f43f5e;
      --glow-cyan: 0 0 15px rgba(56, 189, 248, 0.3);
      --glow-pink: 0 0 15px rgba(244, 63, 94, 0.3);
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.1);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-cyan: #0284c7;
      --accent-pink: #d97706;
      --glow-cyan: none;
      --glow-pink: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      transition: background-color 0.4s ease, color 0.4s ease;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 15% 20%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      font-family: var(--font-digital);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      text-shadow: var(--glow-cyan);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent-pink);
      border-radius: 50%;
      box-shadow: var(--glow-pink);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .controls-top {
      display: flex;
      gap: 0.75rem;
    }

    select, button {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    select:hover, button:hover {
      border-color: var(--accent-cyan);
      box-shadow: var(--glow-cyan);
    }

    main {
      width: 100%;
      max-width: 800px;
      margin: auto 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      background: var(--card-bg);
      padding: 0.35rem;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .tab-btn.active {
      background: var(--accent-cyan);
      color: #030712;
      box-shadow: var(--glow-cyan);
    }

    .view-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem 1.5rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      position: relative;
    }

    .view-card.active {
      display: flex;
    }

    .date-display {
      font-family: var(--font-body);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent-cyan);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .time-display {
      font-family: var(--font-digital);
      font-size: clamp(2.8rem, 9vw, 5.5rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--text-main);
      text-shadow: var(--glow-cyan);
      line-height: 1.1;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .time-display .ampm {
      font-size: 0.35em;
      color: var(--accent-pink);
      text-shadow: var(--glow-pink);
    }

    .time-display .ms {
      font-size: 0.3em;
      color: var(--text-muted);
      width: 2ch;
      text-align: left;
    }

    .btn-toggle-format {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: transparent;
      border: 1px dashed var(--card-border);
    }

    .action-btns {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .btn-primary {
      background: var(--accent-cyan);
      color: #030712;
      border: none;
      font-weight: 700;
      padding: 0.75rem 1.75rem;
      font-size: 1.05rem;
    }

    .btn-secondary {
      background: rgba(236, 72, 153, 0.15);
      color: var(--accent-pink);
      border: 1px solid var(--accent-pink);
      font-weight: 700;
      padding: 0.75rem 1.75rem;
      font-size: 1.05rem;
    }

    .laps-container {
      width: 100%;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding-right: 0.5rem;
    }

    .lap-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      font-family: var(--font-digital);
      font-size: 0.9rem;
      border-left: 3px solid var(--accent-cyan);
    }

    .alarm-input-group {
      display: flex;
      gap: 1rem;
      align-items: center;
      justify-content: center;
    }

    input[type="time"] {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-family: var(--font-digital);
      font-size: 1.75rem;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      outline: none;
    }

    .alarm-status {
      font-size: 1.1rem;
      color: var(--accent-yellow);
      font-weight: 600;
    }

    footer {
      z-index: 10;
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
  </style>
</head>
<body data-theme="cyberpunk">

  <header>
    <div class="brand">
      <div class="brand-dot"></div>
      CHRONO//NEXUS
    </div>
    <div class="controls-top">
      <select id="themeSelect" aria-label="Seleccionar Tema">
        <option value="cyberpunk">⚡ Cyberpunk</option>
        <option value="dark">🌙 Oscuro</option>
        <option value="light">☀️ Claro</option>
      </select>
    </div>
  </header>

  <main>
    <nav class="tabs">
      <button class="tab-btn active" onclick="switchTab('clock')">RELOJ</button>
      <button class="tab-btn" onclick="switchTab('stopwatch')">CRONÓMETRO</button>
      <button class="tab-btn" onclick="switchTab('alarm')">ALARMA</button>
    </nav>

    <div id="clockView" class="view-card active">
      <div id="dateDisplay" class="date-display">Cargando fecha...</div>
      <div class="time-display">
        <span id="timeHours">00</span>:<span id="timeMinutes">00</span>:<span id="timeSeconds">00</span>
        <span id="ampmDisplay" class="ampm"></span>
      </div>
      <button id="formatBtn" class="btn-toggle-format" onclick="toggleFormat()">CAMBIAR A FORMATO 24H</button>
    </div>

    <div id="stopwatchView" class="view-card">
      <div class="time-display">
        <span id="swMinutes">00</span>:<span id="swSeconds">00</span>.<span id="swMs" class="ms">00</span>
      </div>
      <div class="action-btns">
        <button id="swStartBtn" class="btn-primary" onclick="toggleStopwatch()">INICIAR</button>
        <button class="btn-secondary" onclick="lapStopwatch()">VUELTA</button>
        <button class="btn-secondary" onclick="resetStopwatch()">REINICIAR</button>
      </div>
      <div id="lapsContainer" class="laps-container"></div>
    </div>

    <div id="alarmView" class="view-card">
      <div class="alarm-input-group">
        <input type="time" id="alarmTime" />
      </div>
      <div id="alarmStatus" class="alarm-status">Ninguna alarma programada</div>
      <div class="action-btns">
        <button class="btn-primary" onclick="setAlarm()">ESTABLECER ALARMA</button>
        <button class="btn-secondary" onclick="clearAlarm()">CANCELAR</button>
      </div>
    </div>
  </main>

  <footer>
    CHRONO//NEXUS System &copy; 2026
  </footer>

  <script>
    const themeSelect = document.getElementById('themeSelect');
    themeSelect.addEventListener('change', (e) => {
      document.body.setAttribute('data-theme', e.target.value);
    });

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-card').forEach(card => card.classList.remove('active'));

      if (tab === 'clock') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('clockView').classList.add('active');
      } else if (tab === 'stopwatch') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('stopwatchView').classList.add('active');
      } else if (tab === 'alarm') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('alarmView').classList.add('active');
      }
    }

    let is24Hour = false;

    function toggleFormat() {
      is24Hour = !is24Hour;
      document.getElementById('formatBtn').innerText = is24Hour ? 'CAMBIAR A FORMATO 12H' : 'CAMBIAR A FORMATO 24H';
    }

    function updateClock() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('dateDisplay').innerText = now.toLocaleDateString('es-ES', options);

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      let ampm = '';

      if (!is24Hour) {
        ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
      }

      document.getElementById('timeHours').innerText = String(hours).padStart(2, '0');
      document.getElementById('timeMinutes').innerText = minutes;
      document.getElementById('timeSeconds').innerText = seconds;
      document.getElementById('ampmDisplay').innerText = ampm;

      checkAlarm(now);
    }

    setInterval(updateClock, 1000);
    updateClock();

    let swInterval = null;
    let swStartTime = 0;
    let swElapsedTime = 0;
    let swRunning = false;
    let lapCount = 0;

    function toggleStopwatch() {
      const startBtn = document.getElementById('swStartBtn');
      if (swRunning) {
        clearInterval(swInterval);
        swElapsedTime += Date.now() - swStartTime;
        swRunning = false;
        startBtn.innerText = 'CONTINUAR';
      } else {
        swStartTime = Date.now();
        swInterval = setInterval(updateStopwatch, 10);
        swRunning = true;
        startBtn.innerText = 'PAUSAR';
      }
    }

    function updateStopwatch() {
      const totalMs = swElapsedTime + (Date.now() - swStartTime);
      const ms = Math.floor((totalMs % 1000) / 10);
      const sec = Math.floor((totalMs / 1000) % 60);
      const min = Math.floor((totalMs / (1000 * 60)) % 60);

      document.getElementById('swMs').innerText = String(ms).padStart(2, '0');
      document.getElementById('swSeconds').innerText = String(sec).padStart(2, '0');
      document.getElementById('swMinutes').innerText = String(min).padStart(2, '0');
    }

    function resetStopwatch() {
      clearInterval(swInterval);
      swRunning = false;
      swElapsedTime = 0;
      document.getElementById('swStartBtn').innerText = 'INICIAR';
      document.getElementById('swMs').innerText = '00';
      document.getElementById('swSeconds').innerText = '00';
      document.getElementById('swMinutes').innerText = '00';
      document.getElementById('lapsContainer').innerHTML = '';
      lapCount = 0;
    }

    function lapStopwatch() {
      if (!swRunning && swElapsedTime === 0) return;
      lapCount++;
      const min = document.getElementById('swMinutes').innerText;
      const sec = document.getElementById('swSeconds').innerText;
      const ms = document.getElementById('swMs').innerText;

      const lapItem = document.createElement('div');
      lapItem.className = 'lap-item';
      lapItem.innerHTML = `<span>Vuelta ${lapCount}</span><span>${min}:${sec}.${ms}</span>`;
      document.getElementById('lapsContainer').prepend(lapItem);
    }

    let alarmTimeVal = null;
    let alarmTriggered = false;

    function setAlarm() {
      const val = document.getElementById('alarmTime').value;
      if (!val) return;
      alarmTimeVal = val;
      alarmTriggered = false;
      document.getElementById('alarmStatus').innerText = `Alarma fijada a las ${alarmTimeVal}`;
    }

    function clearAlarm() {
      alarmTimeVal = null;
      alarmTriggered = false;
      document.getElementById('alarmStatus').innerText = 'Ninguna alarma programada';
    }

    function checkAlarm(now) {
      if (!alarmTimeVal || alarmTriggered) return;

      const currentHHMM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      if (currentHHMM === alarmTimeVal && now.getSeconds() === 0) {
        alarmTriggered = true;
        playAlarmSound();
        alert(`⏰ ¡ALERTA DE ALARMA! Hora registrada: ${alarmTimeVal}`);
        document.getElementById('alarmStatus').innerText = '¡Alarma Sonando!';
      }
    }

    function playAlarmSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.5);
      } catch (e) {
        console.log('Audio no interactuado aún');
      }
    }
  </script>
</body>
</html>
